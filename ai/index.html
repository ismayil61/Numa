<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><title>Numa AI</title>
<style>
:root{color-scheme:light dark;--bg:#f2f4f8;--surface:#fff;--ink:#111827;--muted:#5b6472;--line:#d8dee8;--accent:#3155e7;--soft:#e9edff;--code:#101522}@media(prefers-color-scheme:dark){:root{--bg:#0b0e14;--surface:#131824;--ink:#eceff6;--muted:#98a1b3;--line:#282f40;--accent:#91a4ff;--soft:#1b2340;--code:#080b12}}*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button,textarea{font:inherit;color:inherit}.hidden{display:none!important}.app{height:100%;display:flex;flex-direction:column}.top{padding:13px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}.top a{font-size:21px;font-weight:850;color:var(--ink);text-decoration:none}.title{flex:1;font-weight:650}.badge{background:var(--soft);color:var(--accent);border-radius:20px;padding:4px 10px;font-size:12px;text-transform:uppercase}.thread{flex:1;overflow:auto;padding:24px 18px}.inner{max-width:780px;margin:auto;display:grid;gap:20px}.welcome{text-align:center;padding:10vh 10px 0}.welcome h1{font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-1px}.welcome p,.hint{color:var(--muted)}.msg{display:grid;gap:5px;overflow-wrap:anywhere}.who{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.bubble{padding:12px 15px;border-radius:13px;white-space:pre-wrap}.user .bubble{justify-self:end;background:var(--soft);max-width:90%}.assistant .bubble{padding-left:0}.bubble pre{white-space:pre-wrap;overflow:auto;background:var(--code);color:#f4f5f8;padding:14px;border-radius:10px}.composer{padding:12px 18px max(16px,env(safe-area-inset-bottom))}.composer form{max-width:780px;margin:auto;display:flex;gap:9px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:8px}.composer textarea{flex:1;min-height:42px;max-height:200px;resize:vertical;border:0;outline:0;background:transparent;padding:9px}.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 15px;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:white}.btn:disabled{opacity:.55;cursor:wait}.hint{text-align:center;font-size:12px;margin:6px}.gate{min-height:100%;display:grid;place-items:center;padding:20px}.card{width:min(450px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px}.error{color:#b42318}
</style></head>
<body>
<section id="gate" class="gate hidden"><div class="card"><a href="/" style="font-size:24px;font-weight:850;color:inherit;text-decoration:none">numa.</a><h1>Numa AI açılmadı</h1><p id="gate-error" class="error">Şəxsi keçid yoxlanılır…</p><p><a href="/">Əsas səhifəyə qayıt</a></p></div></section>
<div id="app" class="app hidden"><header class="top"><a href="/">numa.</a><span id="title" class="title">Numa AI</span><span id="badge" class="badge"></span></header><main id="thread" class="thread"><div id="inner" class="inner"></div></main><div class="composer"><form id="composer"><textarea id="input" rows="1" placeholder="Numa AI-yə sual verin…" aria-label="Mesaj"></textarea><button id="send" class="btn primary" type="submit">Göndər</button></form><div id="plan" class="hint"></div></div></div>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),KEY='numa_ai_key';let token=params.get('key')||localStorage.getItem(KEY)||'',profile=null;let messages=[];
if(params.has('key')){localStorage.setItem(KEY,token);history.replaceState(null,'',location.pathname)}
function showError(message){$('app').classList.add('hidden');$('gate').classList.remove('hidden');$('gate-error').textContent=message}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function format(s){return escapeHTML(s).replace(/```([\s\S]*?)```/g,'<pre>$1</pre>').replace(/\n/g,'<br>')}
function render(){const box=$('inner');box.replaceChildren();if(!messages.length){const welcome=document.createElement('div');welcome.className='welcome';welcome.innerHTML='<h1>Biznesiniz üçün güclü ideyalar.</h1><p>Vebsayt mətni, dizayn və kodla bağlı sualınızı yazın.</p>';box.append(welcome);return}for(const message of messages){const row=document.createElement('div');row.className='msg '+message.role;const who=document.createElement('span');who.className='who';who.textContent=message.role==='user'?'Siz':'Numa AI';const body=document.createElement('div');body.className='bubble';if(message.role==='assistant')body.innerHTML=format(message.content);else body.textContent=message.content;row.append(who,body);box.append(row)}$('thread').scrollTop=$('thread').scrollHeight}
async function boot(){if(!token){showError('Keçid açarı yoxdur. Admin-dən sizə göndərilmiş şəxsi keçidi istifadə edin.');return}try{const response=await fetch('/.netlify/functions/ai?key='+encodeURIComponent(token),{cache:'no-store'});const data=await response.json();if(!response.ok)throw new Error(data.error||'Keçid təsdiqlənmədi.');profile=data;$('title').textContent=data.customerName?data.customerName+' üçün AI':'Müştəri AI';$('badge').textContent=data.tier;$('plan').textContent=`${Math.max(0,data.messageLimit-data.messagesUsed)} / ${data.messageLimit} mesaj qalıb`;$('app').classList.remove('hidden');render()}catch(error){showError(error.message)}}
$('composer').addEventListener('submit',async event=>{event.preventDefault();const text=$('input').value.trim();if(!text||$('send').disabled)return;if(profile.messagesUsed>=profile.messageLimit){showError('Mesaj limitiniz bitib. Admin ilə əlaqə saxlayın.');return}messages.push({role:'user',content:text});$('input').value='';$('send').disabled=true;render();const pending=document.createElement('div');pending.className='msg assistant';pending.textContent='Numa AI cavab hazırlayır…';$('inner').append(pending);try{const response=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,messages:messages.slice(-20)})});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI sorğusu alınmadı.');messages.push({role:'assistant',content:data.reply});profile.messagesUsed=data.messagesUsed;$('plan').textContent=`${Math.max(0,profile.messageLimit-profile.messagesUsed)} / ${profile.messageLimit} mesaj qalıb`}catch(error){messages.pop();messages.push({role:'assistant',content:'Xəta: '+error.message})}finally{$('send').disabled=false;render();$('input').focus()}});
$('input').addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();$('composer').requestSubmit()}});boot();
</script></body></html>
