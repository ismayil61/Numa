<!doctype html>
<html lang="az">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Numa AI</title>
  <style>
    :root{color-scheme:light dark;--bg:#f2f4f8;--surface:#fff;--ink:#111827;--muted:#5b6472;--line:#d8dee8;--accent:#3155e7;--soft:#e9edff;--code:#101522}
    @media(prefers-color-scheme:dark){:root{--bg:#0b0e14;--surface:#131824;--ink:#eceff6;--muted:#98a1b3;--line:#282f40;--accent:#91a4ff;--soft:#1b2340;--code:#080b12}}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}.hidden{display:none!important}.layout{height:100%;display:grid;grid-template-columns:270px minmax(0,1fr)}aside{background:var(--surface);border-right:1px solid var(--line);padding:20px;display:flex;flex-direction:column;gap:14px}.logo{font-size:25px;font-weight:850;letter-spacing:-1.5px;text-decoration:none;color:var(--ink)}.logo i{color:var(--accent);font-style:normal}.plan{border:1px solid var(--line);border-radius:13px;padding:13px;font-size:14px;color:var(--muted)}.plan b{display:block;color:var(--ink);font-size:18px}.chats{flex:1;overflow:auto;color:var(--muted);font-size:14px}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.top{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{border-radius:99px;background:var(--soft);color:var(--accent);padding:4px 10px;font-size:12px;font-weight:700;text-transform:uppercase}.thread{flex:1;overflow:auto;padding:24px}.inner{max-width:780px;margin:auto;display:grid;gap:20px}.welcome{text-align:center;padding:10vh 10px 0}.welcome h1{font-size:clamp(28px,5vw,42px);line-height:1.1;letter-spacing:-1.3px}.welcome p{color:var(--muted)}.msg{display:grid;gap:5px;max-width:100%;overflow-wrap:anywhere}.who{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.bubble{padding:12px 15px;border-radius:13px;white-space:pre-wrap}.user .bubble{justify-self:end;background:var(--soft);max-width:90%}.assistant .bubble{padding-left:0}.bubble pre{white-space:pre-wrap;overflow:auto;background:var(--code);color:#f4f5f8;padding:14px;border-radius:10px}.composer{padding:12px 20px max(16px,env(safe-area-inset-bottom))}.composer form{max-width:780px;margin:auto;display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:8px}.composer textarea{flex:1;min-height:42px;max-height:200px;resize:vertical;border:0;outline:0;background:transparent;padding:9px}.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 15px;font-weight:650}.btn.primary{background:var(--accent);border-color:var(--accent);color:white}.btn:disabled{opacity:.55;cursor:wait}.error{color:#b42318;padding:8px 0}.hint{text-align:center;color:var(--muted);font-size:12px;margin:6px}.gate{min-height:100%;display:grid;place-items:center;padding:20px}.card{width:min(440px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;display:grid;gap:14px}.card input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{display:none}.top{padding:12px}.thread{padding:18px 14px}.composer{padding-inline:12px}}
  </style>
</head>
<body>
  <section id="gate" class="gate hidden">
    <form class="card" id="gate-form">
      <a class="logo" href="/">numa<i>.</i></a>
      <h1>Numa AI-yə xoş gəlmisiniz</h1>
      <p>Admin panelindən yaradılmış şəxsi keçidi açın və ya giriş açarını daxil edin.</p>
      <label>Giriş açarı<input id="key-input" required autocomplete="off"></label>
      <div id="gate-error" class="error" role="alert"></div>
      <button class="btn primary" type="submit">Davam et</button>
      <a href="/">Əsas səhifəyə qayıt</a>
    </form>
  </section>
  <div id="app" class="layout hidden">
    <aside><a class="logo" href="/">numa<i>.</i> AI</a><button class="btn primary" id="new-chat">+ Yeni söhbət</button><div class="chats" id="chat-list">Söhbət tarixçəsi bu cihazda saxlanılır.</div><div class="plan" id="plan"></div><button class="btn" id="signout">Çıxış</button></aside>
    <main class="main">
      <header class="top"><b id="title">Yeni söhbət</b><span id="badge" class="badge"></span></header>
      <div class="thread" id="thread"><div class="inner" id="inner"></div></div>
      <div class="composer"><form id="composer"><textarea id="input" rows="1" placeholder="Numa AI-yə sual verin…" aria-label="Mesaj"></textarea><button class="btn primary" id="send" type="submit">Göndər</button></form><div class="hint">Enter — göndər · Shift+Enter — yeni sətir</div></div>
    </main>
  </div>
<script>
const KEY_NAME='numa_ai_key';
const $=id=>document.getElementById(id);
const params=new URLSearchParams(location.search);
if(params.has('key')){localStorage.setItem(KEY_NAME,params.get('key').trim());history.replaceState(null,'',location.pathname)}
let accessKey=localStorage.getItem(KEY_NAME)||'';
let links=readLinks();
let activeLink=links.find(item=>item.token===accessKey&&item.state==='active');
let tier=activeLink?.tier||'starter';
let storageKey='numa_chats_'+accessKey;
let chats=readChats();
let chatId=null;
function readLinks(){try{return JSON.parse(localStorage.getItem('numa_links')||'[]')}catch{return []}}
function readChats(){try{return JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{return {}}}
function saveChats(){localStorage.setItem(storageKey,JSON.stringify(chats))}
function showGate(message=''){ $('app').classList.add('hidden');$('gate').classList.remove('hidden');$('gate-error').textContent=message }
function start(){links=readLinks();activeLink=links.find(item=>item.token===accessKey&&item.state==='active');if(!activeLink){showGate('Bu açar bu brauzerdə tapılmadı. Admin linkini yarandığı cihazda açın.');return}tier=['starter','standard','premium'].includes(activeLink.tier)?activeLink.tier:'starter';storageKey='numa_chats_'+accessKey;chats=readChats();$('gate').classList.add('hidden');$('app').classList.remove('hidden');$('badge').textContent=tier;const names={starter:'Starter',standard:'Standard',premium:'Premium'};$('plan').innerHTML=`Planınız<b>${names[tier]}</b>${Math.max(0,(activeLink.messageLimit||0)-(activeLink.messagesUsed||0))} mesaj qalıb`;renderList();const first=Object.keys(chats)[0];first?openChat(first):newChat()}
$('gate-form').addEventListener('submit',e=>{e.preventDefault();accessKey=$('key-input').value.trim();localStorage.setItem(KEY_NAME,accessKey);start()});
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function format(s){return escapeHTML(s).replace(/```([\s\S]*?)```/g,'<pre>$1</pre>').replace(/\n/g,'<br>')}
function render(){const inner=$('inner');inner.replaceChildren();const chat=chats[chatId];if(!chat){inner.innerHTML='<div class="welcome"><h1>Biznesiniz üçün güclü ideyalar.</h1><p>Vebsayt mətni, dizayn və ya kod barədə sualınızı yazın.</p></div>';return}for(const m of chat.messages){const el=document.createElement('div');el.className='msg '+m.role;const who=document.createElement('span');who.className='who';who.textContent=m.role==='user'?'Siz':'Numa AI';const body=document.createElement('div');body.className='bubble';if(m.role==='assistant')body.innerHTML=format(m.content);else body.textContent=m.content;el.append(who,body);inner.append(el)}$('thread').scrollTop=$('thread').scrollHeight}
function renderList(){const list=$('chat-list');list.replaceChildren();Object.values(chats).forEach(chat=>{const b=document.createElement('button');b.className='btn';b.style.cssText='display:block;width:100%;margin:4px 0;text-align:left;overflow:hidden;text-overflow:ellipsis';b.textContent=chat.title;b.onclick=()=>openChat(chat.id);list.append(b)})}
function openChat(id){chatId=id;$('title').textContent=chats[id].title;render()}
function newChat(){chatId=null;$('title').textContent='Yeni söhbət';render()}
$('new-chat').onclick=newChat;
$('signout').onclick=()=>{localStorage.removeItem(KEY_NAME);location.reload()};
$('composer').addEventListener('submit',async e=>{e.preventDefault();const text=$('input').value.trim();if(!text||$('send').disabled)return;if(activeLink.messagesUsed>=activeLink.messageLimit){alert('Mesaj limitiniz bitib.');return}if(!chatId){chatId='chat_'+Date.now();chats[chatId]={id:chatId,title:text.slice(0,48),messages:[]}}const chat=chats[chatId];chat.messages.push({role:'user',content:text});$('input').value='';$('send').disabled=true;render();const loading=document.createElement('div');loading.className='msg assistant';loading.textContent='Numa AI cavab hazırlayır…';$('inner').append(loading);try{const response=await fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tier,messages:chat.messages.slice(-20)})});const data=await response.json();if(!response.ok)throw new Error(data.error||'AI sorğusu alınmadı.');chat.messages.push({role:'assistant',content:data.reply});activeLink.messagesUsed=(activeLink.messagesUsed||0)+1;links=links.map(item=>item.token===activeLink.token?activeLink:item);localStorage.setItem('numa_links',JSON.stringify(links));$('plan').innerHTML=`Planınız<b>${tier[0].toUpperCase()+tier.slice(1)}</b>${Math.max(0,activeLink.messageLimit-activeLink.messagesUsed)} mesaj qalıb`}catch(error){chat.messages.pop();chat.messages.push({role:'assistant',content:'Xəta: '+error.message});}finally{saveChats();renderList();render();$('send').disabled=false;$('input').focus()}});
$('input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('composer').requestSubmit()}});
start();
</script>
</body>
</html>
