<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Numa · Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#0E1116; --muted:#556070; --line:#D8DEE8;
  --accent:#2447F5; --on-accent:#FFFFFF; --soft:#E6EBFF; --err:#B42318; --ok:#067647;
  --display:'Bricolage Grotesque',system-ui,sans-serif; --body:'Hanken Grotesk',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#0B0E14;--surface:#131824;--ink:#ECEFF6;--muted:#98A1B3;--line:#232A3A;--accent:#7C93FF;--on-accent:#0B1033;--soft:#1B2340;--err:#FF8A80;--ok:#6CE9A6;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;padding:0 max(16px,env(safe-area-inset-left)) 48px max(16px,env(safe-area-inset-right))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.wrap{max-width:1040px;margin:0 auto}
.nav{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;padding-top:max(16px,env(safe-area-inset-top))}
.logo{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.03em;text-decoration:none;color:inherit}
.logo i{font-style:normal;color:var(--accent)}
.logo small{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-left:8px;font-weight:400}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,5vw,44px);letter-spacing:-.03em;line-height:1.05;margin:24px 0 8px}
h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:0 0 14px}
.sub{color:var(--muted);margin:0 0 24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,28px)}
.narrow{max-width:440px;margin:10vh auto 0;display:grid;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.field{display:grid;gap:6px;font-size:14px;font-weight:500}
.field input,.field select,.field textarea{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:400;font-size:16px;width:100%}
.field .help{color:var(--muted);font-weight:400;font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px 18px;border-radius:10px;font-weight:600;border:1.5px solid var(--ink);background:transparent;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:6px 11px;font-size:14px;border-width:1px;border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.error{color:var(--err);font-size:15px}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:560px){.plans{grid-template-columns:minmax(0,1fr)}}
.plans label{border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.plans input{position:absolute;opacity:0;pointer-events:none}
.plans label:has(input:checked){border-color:var(--accent);background:var(--soft)}
.plans b{font-family:var(--display);font-size:20px}
.plans span{font-size:13px;color:var(--muted)}
.result{margin-top:18px;border:1.5px solid var(--accent);background:var(--soft);border-radius:14px;padding:16px;display:grid;gap:10px}
.result code{font-family:var(--mono);font-size:14px;word-break:break-all;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:block}
section{margin-top:28px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters input{flex:1;min-width:200px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.filters select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.links{display:grid;gap:10px}
.link{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.link .head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.link .name{font-weight:600;font-size:17px}
.link .email{color:var(--muted);font-size:14px}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.pill.premium{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pill.standard{background:var(--soft);color:var(--accent);border-color:transparent}
.pill.active{color:var(--ok);border-color:currentColor}
.pill.revoked,.pill.expired,.pill.used_up{color:var(--err);border-color:currentColor}
.meta{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.note{font-size:14px;color:var(--muted);font-style:italic}
footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:500;z-index:50}
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav">
    <a class="logo" href="/">numa<i>.</i><small>Admin</small></a>
    <button class="btn sm hidden" id="logout" type="button">Log out</button>
  </nav>

  <!-- Login -->
  <form class="card narrow" id="login">
    <h2>Admin login</h2>
    <label class="field">Password <input type="password" id="login-pw" autocomplete="current-password" required></label>
    <div class="error hidden" id="login-err" role="alert"></div>
    <button class="btn primary" type="submit">Log in</button>
  </form>

  <!-- Dashboard -->
  <div id="dash" class="hidden">
    <h1>Customer AI links</h1>
    <p class="sub">After a customer pays, create a link here and send it to them from Gmail. The link opens the Numa AI for their plan.</p>
    
    <form class="card" id="create">
      <h2>New link</h2>
      <div class="plans" id="plan-pick" role="radiogroup" aria-label="Plan"></div>
      <div class="grid" style="margin-top:14px">
        <label class="field">Customer name <input id="c-name" maxlength="120" placeholder="e.g. Maria Lopez"></label>
        <label class="field">Customer email <input id="c-email" type="email" maxlength="200" placeholder="customer@gmail.com"></label>
        <label class="field">Messages included <input id="c-limit" type="number" min="1" max="100000" required>
          <span class="help">How many questions they can ask in total.</span></label>
        <label class="field">Access ends after <select id="c-days">
          <option value="">Never</option><option value="30">30 days</option><option value="90">90 days</option>
          <option value="180">6 months</option><option value="365">1 year</option></select></label>
      </div>
      <label class="field" style="margin-top:14px">Private note (only you see this) <input id="c-note" maxlength="500" placeholder="e.g. Paid by PayPal on 5 Nov"></label>
      <div class="row" style="margin-top:16px"><button class="btn primary" type="submit" id="create-btn">Create link</button></div>
      <div class="result hidden" id="result" aria-live="polite"></div>
    </form>

    <section>
      <h2>All links</h2>
      <div class="filters">
        <input id="q" type="search" placeholder="Search by name, email or note" aria-label="Search links">
        <select id="f-tier" aria-label="Filter by plan"><option value="">All plans</option><option value="starter">Starter</option><option value="standard">Standard</option><option value="premium">Premium</option></select>
        <select id="f-state" aria-label="Filter by status"><option value="">Any status</option><option value="active">Active</option><option value="revoked">Turned off</option></select>
      </div>
      <div class="links" id="links"></div>
    </section>
    <footer><span>Numa admin · keep this page private</span><a href="/" style="color:var(--accent)">View site</a></footer>
  </div>
</div>

<script>
const ADMIN_PASS = 's46s8SmX4JPzdbH';
const $ = (id) => document.getElementById(id);
const TIER_NAMES = { starter: 'Starter', standard: 'Standard', premium: 'Premium' };
const STATE_NAMES = { active: 'Active', revoked: 'Turned off' };
const tiers = [
  { id: 'starter', name: 'Starter', price: '$10', defaultMessageLimit: 50 },
  { id: 'standard', name: 'Standard', price: '$15', defaultMessageLimit: 100 },
  { id: 'premium', name: 'Premium', price: '$25', defaultMessageLimit: 200 }
];

function getLinks() {
  try { return JSON.parse(localStorage.getItem('numa_links') || '[]'); } catch { return []; }
}
function saveLinks(l) {
  localStorage.setItem('numa_links', JSON.stringify(l));
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 1800);
}
function linkUrl(l) {
  return `${location.origin}/ai/?key=${encodeURIComponent(l.token)}`;
}

$('login').addEventListener('submit', (e) => {
  e.preventDefault();
  if ($('login-pw').value === ADMIN_PASS) {
    localStorage.setItem('numa_admin_auth', 'true');
    boot();
  } else {
    $('login-err').textContent = 'Invalid password.';
    $('login-err').classList.remove('hidden');
  }
});

$('logout').addEventListener('click', () => {
  localStorage.removeItem('numa_admin_auth');
  boot();
});

function boot() {
  const isAuth = localStorage.getItem('numa_admin_auth') === 'true';
  if (isAuth) {
    $('login').classList.add('hidden');
    $('dash').classList.remove('hidden');
    $('logout').classList.remove('hidden');
    initDash();
  } else {
    $('login').classList.remove('hidden');
    $('dash').classList.add('hidden');
    $('logout').classList.add('hidden');
  }
}

function initDash() {
  $('plan-pick').innerHTML = tiers.map((t, i) => `
    <label><input type="radio" name="tier" value="${t.id}" ${i === 0 ? 'checked' : ''}>
      <b>${t.name} ${t.price}</b><span>Plan</span></label>`).join('');

  const setLimit = () => {
    const t = tiers.find(x => x.id === document.querySelector('input[name=tier]:checked').value);
    $('c-limit').value = t.defaultMessageLimit;
  };
  $('plan-pick').addEventListener('change', setLimit);
  setLimit();
  renderLinks();
}

$('create').addEventListener('submit', (e) => {
  e.preventDefault();
  const links = getLinks();
  const days = $('c-days').value;
  const newLink = {
    id: Date.now(),
    token: 'NUMA-' + Math.random().toString(36).substring(2, 6).toUpperCase() + '-' + Math.random().toString(36).substring(2, 6).toUpperCase(),
    tier: document.querySelector('input[name=tier]:checked').value,
    customerName: $('c-name').value,
    customerEmail: $('c-email').value,
    note: $('c-note').value,
    messageLimit: Number($('c-limit').value),
    messagesUsed: 0,
    expiresAt: days ? new Date(Date.now() + days * 86400000).toISOString() : null,
    state: 'active',
    createdAt: new Date().toISOString()
  };

  links.unshift(newLink);
  saveLinks(links);
  renderLinks();

  const r = $('result');
  r.classList.remove('hidden');
  r.innerHTML = `<b>Link ready for ${newLink.customerName || 'customer'} (${TIER_NAMES[newLink.tier]})</b>
    <code>${linkUrl(newLink)}</code>
    <div class="row">
      <button class="btn primary" type="button" onclick="navigator.clipboard.writeText('${linkUrl(newLink)}');toast('Link copied')">Copy link</button>
    </div>`;

  $('c-name').value = '';
  $('c-email').value = '';
  $('c-note').value = '';
});

function renderLinks() {
  const q = $('q').value.trim().toLowerCase();
  const ft = $('f-tier').value;
  const fs = $('f-state').value;
  const links = getLinks();

  const list = links.filter(l =>
    (!ft || l.tier === ft) && (!fs || l.state === fs) &&
    (!q || [l.customerName, l.customerEmail, l.note].join(' ').toLowerCase().includes(q))
  );

  const box = $('links');
  if (!list.length) {
    box.innerHTML = `<div class="empty">No links match.</div>`;
    return;
  }

  box.innerHTML = list.map(l => `
    <article class="link">
      <div class="head">
        <span class="name">${l.customerName || 'No name'}</span>
        <span class="email">${l.customerEmail || ''}</span>
        <span class="pill ${l.tier}">${TIER_NAMES[l.tier]}</span>
        <span class="pill ${l.state}">${STATE_NAMES[l.state]}</span>
      </div>
      <div class="meta">
        <span>Used <b>${l.messagesUsed} / ${l.messageLimit}</b></span>
        <span>Created <b>${new Date(l.createdAt).toLocaleDateString()}</b></span>
      </div>
      ${l.note ? `<div class="note">${l.note}</div>` : ''}
      <div class="row">
        <button class="btn sm" onclick="navigator.clipboard.writeText('${linkUrl(l)}');toast('Link copied')">Copy link</button>
        <button class="btn sm" onclick="toggleState(${l.id})">${l.state === 'revoked' ? 'Turn back on' : 'Turn off'}</button>
        <button class="btn sm" onclick="delLink(${l.id})" style="color:var(--err)">Delete</button>
      </div>
    </article>
  `).join('');
}

window.toggleState = function(id) {
  let links = getLinks();
  links = links.map(l => l.id === id ? {...l, state: l.state === 'active' ? 'revoked' : 'active'} : l);
  saveLinks(links);
  renderLinks();
};

window.delLink = function(id) {
  if (!confirm('Delete this link?')) return;
  let links = getLinks().filter(l => l.id !== id);
  saveLinks(links);
  renderLinks();
};

['q', 'f-tier', 'f-state'].forEach(id => $(id).addEventListener('input', renderLinks));
boot();
</script>
</body>
</html>
