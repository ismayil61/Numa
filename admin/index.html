<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow">
<title>Numa · Admin</title>
<style>
:root{color-scheme:light dark;--bg:#f2f4f8;--surface:#fff;--ink:#111827;--muted:#5b6472;--line:#d8dee8;--accent:#3155e7;--soft:#e9edff}@media(prefers-color-scheme:dark){:root{--bg:#0b0e14;--surface:#131824;--ink:#eceff6;--muted:#98a1b3;--line:#282f40;--accent:#91a4ff;--soft:#1b2340}}*{box-sizing:border-box}body{margin:0;padding:24px;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}.wrap{max-width:950px;margin:auto}h1,h2{letter-spacing:-.03em}.card,.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:grid;gap:6px;color:var(--muted);font-size:14px}input,select,button{font:inherit;color:var(--ink)}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;background:var(--bg)}button{padding:10px 15px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:white}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}.list{display:grid;gap:10px}.item{margin:0;display:grid;gap:8px}.muted{color:var(--muted)}code{overflow-wrap:anywhere}.error{color:#c62828;white-space:pre-wrap}a{color:var(--accent)}
</style>
</head>
<body><main class="wrap">
<header class="row" style="justify-content:space-between;margin:0"><h1><a href="/" style="text-decoration:none;color:inherit">numa.</a> Müştəri AI keçidləri</h1><a href="/ai/">AI səhifəsi</a></header>
<section id="login" class="card"><h2>Admin girişi</h2><p class="muted">ADMIN_PASSWORD Netlify mühiti dəyişənində olan admin şifrəsini daxil edin.</p><form id="login-form"><label>Admin şifrəsi<input id="password" type="password" autocomplete="current-password" required></label><div class="row"><button class="primary" type="submit">Daxil ol</button></div></form><p id="login-error" class="error"></p></section>
<div id="dashboard" hidden>
<section class="card"><h2>Yeni müştəri keçidi</h2><form id="create-form"><div class="grid"><label>Plan<select id="tier"><option value="starter">Starter</option><option value="standard">Standard</option><option value="premium">Premium</option></select></label><label>Mesaj limiti<input id="limit" type="number" min="1" max="100000" value="50" required></label><label>Müştəri adı<input id="name" maxlength="120"></label><label>Müştəri e-poçtu<input id="email" type="email" maxlength="200"></label><label>Keçid müddəti<select id="days"><option value="">Müddətsiz</option><option value="30">30 gün</option><option value="90">90 gün</option><option value="180">6 ay</option><option value="365">1 il</option></select></label><label>Daxili qeyd<input id="note" maxlength="500"></label></div><div class="row"><button class="primary" id="create-button" type="submit">Keçid yarat</button></div></form><p id="form-error" class="error"></p><div id="created" class="muted"></div></section>
<section><h2>Keçidlər</h2><p id="status" class="muted"></p><div id="links" class="list"></div></section></div></main>
<script>
const $=id=>document.getElementById(id);let adminPassword=sessionStorage.getItem('numa_admin_password')||'';
async function api(path,options={}){const response=await fetch('/.netlify/functions/links'+path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+adminPassword,...options.headers}});const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.error||'Sorğu alınmadı ('+response.status+')');return data}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();adminPassword=$('password').value;try{await api('');sessionStorage.setItem('numa_admin_password',adminPassword);showDashboard()}catch(err){$('login-error').textContent=err.message}});
function showDashboard(){$('login').hidden=true;$('dashboard').hidden=false;loadLinks()}
$('tier').addEventListener('change',()=>{$('limit').value={starter:50,standard:100,premium:200}[$('tier').value]});
$('create-form').addEventListener('submit',async e=>{e.preventDefault();$('form-error').textContent='';$('create-button').disabled=true;try{const days=$('days').value;const {link}=await api('',{method:'POST',body:JSON.stringify({tier:$('tier').value,messageLimit:Number($('limit').value),customerName:$('name').value,customerEmail:$('email').value,note:$('note').value,expiresAt:days?new Date(Date.now()+Number(days)*86400000).toISOString():null})});const url=location.origin+'/ai/?key='+encodeURIComponent(link.token);$('created').innerHTML='Keçid yaradıldı: <a href="'+url+'" target="_blank" rel="noopener">'+url+'</a> <button type="button" id="copy-link">Kopyala</button>';document.getElementById('copy-link').onclick=async()=>{await navigator.clipboard.writeText(url);document.getElementById('copy-link').textContent='Kopyalandı'};$('name').value='';$('email').value='';$('note').value='';await loadLinks()}catch(err){$('form-error').textContent=err.message}finally{$('create-button').disabled=false}});
async function loadLinks(){try{$('status').textContent='Yüklənir…';const {links}=await api('');const box=$('links');box.replaceChildren();if(!links.length){$('status').textContent='Hələ keçid yoxdur.';return}$('status').textContent='Cəmi '+links.length+' keçid';for(const item of links){const article=document.createElement('article');article.className='item';const title=document.createElement('strong');title.textContent=(item.customerName||'Adsız müştəri')+' · '+item.tier;const detail=document.createElement('span');detail.className='muted';detail.textContent=(item.customerEmail||'E-poçt yoxdur')+' · '+item.messagesUsed+' / '+item.messageLimit+' mesaj · '+item.state;const url=location.origin+'/ai/?key='+encodeURIComponent(item.token);const link=document.createElement('a');link.href=url;link.textContent=url;link.target='_blank';link.rel='noopener';const controls=document.createElement('div');controls.className='row';const toggle=document.createElement('button');toggle.textContent=item.state==='active'?'Deaktiv et':'Aktiv et';toggle.onclick=async()=>{await api('',{method:'PATCH',body:JSON.stringify({token:item.token,state:item.state==='active'?'revoked':'active'})});loadLinks()};const remove=document.createElement('button');remove.textContent='Sil';remove.onclick=async()=>{if(confirm('Bu keçidi silmək istəyirsiniz?')){await api('?token='+encodeURIComponent(item.token),{method:'DELETE'});loadLinks()}};controls.append(toggle,remove);article.append(title,detail,link,controls);box.append(article)}}catch(err){$('status').textContent=err.message;if(err.message.includes('Admin sign-in')){sessionStorage.removeItem('numa_admin_password');$('login').hidden=false;$('dashboard').hidden=true}}}
if(adminPassword){api('').then(showDashboard).catch(()=>{sessionStorage.removeItem('numa_admin_password');adminPassword=''})}
</script></body></html>
